# OpenAI Model Configuration

provider: openai
models:
  gpt-4:
    model_name: gpt-4
    temperature: 0.7
    max_tokens: 2000
    top_p: 1.0
    frequency_penalty: 0.0
    presence_penalty: 0.0
    
  gpt-4-turbo:
    model_name: gpt-4-turbo-preview
    temperature: 0.7
    max_tokens: 4000
    
  gpt-3.5-turbo:
    model_name: gpt-3.5-turbo
    temperature: 0.7
    max_tokens: 2000

# Rate Limiting
rate_limits:
  requests_per_minute: 60
  tokens_per_minute: 90000

# Retry Configuration
retry:
  max_retries: 3
  base_delay: 1.0
  max_delay: 60.0
