# Anthropic Model Configuration

provider: anthropic
models:
  claude-3-opus:
    model_name: claude-3-opus-20240229
    temperature: 0.7
    max_tokens: 4000
    
  claude-3-sonnet:
    model_name: claude-3-sonnet-20240229
    temperature: 0.7
    max_tokens: 4000
    
  claude-3-haiku:
    model_name: claude-3-haiku-20240307
    temperature: 0.7
    max_tokens: 4000

# Rate Limiting
rate_limits:
  requests_per_minute: 50
  tokens_per_minute: 100000

# Retry Configuration
retry:
  max_retries: 3
  base_delay: 1.0
  max_delay: 60.0
